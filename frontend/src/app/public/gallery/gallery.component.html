<section id="gallery" class="gallery-section">
  <div class="container">
    <div class="section-header">
      <h2>{{ translations.gallery?.title }}</h2>
      <p>{{ translations.gallery?.subtitle }}</p>
    </div>

    <div class="gallery-grid">
      <div 
        *ngFor="let image of galleryImages"
        class="gallery-item"
        (click)="openLightbox(image)">
        <img [src]="image.src" [alt]="image.title" class="gallery-image">
        <div class="gallery-overlay">
          <h3>{{ image.title }}</h3>
          <p>{{ image.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div *ngIf="selectedImage" class="lightbox" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeLightbox()">&times;</button>
      <img [src]="selectedImage.src" [alt]="selectedImage.title" class="lightbox-image">
      <div class="lightbox-info">
        <h3>{{ selectedImage.title }}</h3>
        <p>{{ selectedImage.description }}</p>
      </div>
    </div>
  </div>
</section>
