version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: villa_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: villamanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - villa_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: villa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - villa_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  villa_network:
    driver: bridge

# To use this for local development instead of Supabase:
# 1. Uncomment this file
# 2. Update .env to use: postgresql://postgres:password@localhost:5432/villamanager
# 3. Run: docker-compose up -d
# 4. Access pgAdmin at http://localhost:5050
# 5. Connect to postgres server with host: postgres, user: postgres, password: password
